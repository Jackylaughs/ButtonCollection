<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="いろんなサイトを見てCSSをパクって吸収したい">
    <title>ボタンをいっぱい作って押しまくる！</title>

    <link rel="stylesheet" href="./sanitize.css">
    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass_background">
        <h2 class="glass_title">グラスモーフィズムの習作</h2>
        <div class="glass_container">
            <div class="glass_searchbar_wrap">
                <img src="./images/article_icon.svg" alt="メモ" class="article_icon">
                <input 
                    type="text"
                    placeholder="ここに文字を入力"
                    maxlength="26"
                    class="glass_searchbar">
                <img src="./images/add_icon.svg" alt="追加" class="add_button">
            </div>
            <div class="icon_wrap">
                <img src="./images/image_icon.svg" alt="画像">
                <img src="./images/file_icon.svg" alt="ファイル">
                <img src="./images/folder_icon.svg" alt="フォルダ">
                <img src="./images/clip_icon.svg" alt="クリップ">
                <img src="./images/emoji_icon.svg" alt="絵文字">
                <span></span>
                <img src="./images/audio_icon.svg" alt="音声">
            </div>
        </div>
        <a href="https://www.perplexity.ai/personal-computer" target="blank">参考にしたサイト：perplexity
            <img src="./images/open_link_icon.svg" alt="リンク">
        </a>
    </div>
</body>
</html>
